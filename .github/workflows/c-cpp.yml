name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-win64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      artifact-name: u8-emu-frontend-cpp-win64

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.MY_TOKEN }}
        submodules: recursive
    
    - name: Setup MSYS2 MINGW64
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-sdl3 mingw-w64-x86_64-sdl3-image mingw-w64-x86_64-stb mingw-w64-x86_64-ntldd mingw-w64-x86_64-libzip
        release: false
    
    - name: Compile
      run: mingw32-make CXXFLAGS_EX="-DGITHUB_RUNID=${{ github.run_id }}" release
    
    - name: Prepare build artifact
      run: |
        mkdir -p dist/u8-emu-frontend-cpp
        cd bin/release
        cp u8-emu-frontend-cpp.exe ../../dist/u8-emu-frontend-cpp/
        cp ../../LICENSE ../../dist/u8-emu-frontend-cpp/LICENSE
        ntldd -R u8-emu-frontend-cpp.exe | grep "msys" | awk '{print $3}' | sed 's/\\/\//g' > dlls.txt
        xargs -a dlls.txt cp -t ../../dist/u8-emu-frontend-cpp/
        cp /mingw64/bin/zlib1.dll ../../dist/u8-emu-frontend-cpp/ || true
        cp /mingw64/bin/libpng*.dll ../../dist/u8-emu-frontend-cpp/ || true
        cp /mingw64/bin/libjpeg*.dll ../../dist/u8-emu-frontend-cpp/ || true
        cp /mingw64/bin/libturbojpeg*.dll ../../dist/u8-emu-frontend-cpp/ || true
        cp /mingw64/bin/libwebp*.dll ../../dist/u8-emu-frontend-cpp/ || true
        cp /mingw64/bin/libtiff*.dll ../../dist/u8-emu-frontend-cpp/ || true
        cp /mingw64/bin/libjxl*.dll ../../dist/u8-emu-frontend-cpp/ || true
        cp /mingw64/bin/libavif*.dll ../../dist/u8-emu-frontend-cpp/ || true
        cp /mingw64/bin/libaom*.dll ../../dist/u8-emu-frontend-cpp/ || true
        cp /mingw64/bin/libdav1d*.dll ../../dist/u8-emu-frontend-cpp/ || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: u8-emu-frontend-cpp-win64
        path: dist/u8-emu-frontend-cpp

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      artifact-name: u8-emu-frontend-cpp-linux

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.MY_TOKEN }}
        submodules: recursive
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsdl3-dev libsdl3-image-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev zlib1g-dev libzip-dev

    - name: Compile
      run: make CXXFLAGS_EX="-DGITHUB_RUNID=${{ github.run_id }}" release_linux

    - name: Prepare build artifact
      run: |
        mkdir -p dist/u8-emu-frontend-cpp
        cp u8-emu-frontend-cpp dist/u8-emu-frontend-cpp/
        cp LICENSE dist/u8-emu-frontend-cpp/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: u8-emu-frontend-cpp-linux
        path: dist/u8-emu-frontend-cpp

  release:
    runs-on: ubuntu-latest
    needs: [build-win64, build-linux]
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: u8-emu-frontend-cpp-win64
        path: u8-emu-frontend-cpp-win64

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: u8-emu-frontend-cpp-linux
        path: u8-emu-frontend-cpp-linux

    - name: Create ZIPs
      run: |
        zip -r u8-emu-frontend-cpp-win64.zip u8-emu-frontend-cpp-win64
        zip -r u8-emu-frontend-cpp-linux.zip u8-emu-frontend-cpp-linux

    - name: Delete old release
      uses: larryjoelane/delete-release-action@v1.0.24
      with:
        release-name: continuous
        token: ${{ secrets.MY_TOKEN }}

    - name: Create new release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: Continuous build
        tag_name: continuous
        body: "NOTE: This is a continuous release. Binaries are rebuilt automatically when changes are made."
        files: |
          u8-emu-frontend-cpp-win64.zip
          u8-emu-frontend-cpp-linux.zip
        draft: false
        make_latest: true
